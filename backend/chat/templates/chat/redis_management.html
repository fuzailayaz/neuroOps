<!DOCTYPE html>
<html>
<head>
    <title>Redis Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { margin-top: 30px; }
        .card { margin-bottom: 20px; }
        .key-value-pair { margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Redis Management</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Set Key-Value Pair</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="key" class="form-label">Key</label>
                            <input type="text" class="form-control" id="key" placeholder="Enter key">
                        </div>
                        <div class="mb-3">
                            <label for="value" class="form-label">Value</label>
                            <input type="text" class="form-control" id="value" placeholder="Enter value">
                        </div>
                        <div class="mb-3">
                            <label for="ttl" class="form-label">TTL (seconds, optional)</label>
                            <input type="number" class="form-control" id="ttl" placeholder="300">
                        </div>
                        <button class="btn btn-primary" onclick="setKeyValue()">Set Key-Value</button>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header">Get Value by Key</div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" id="getKey" placeholder="Enter key">
                            <button class="btn btn-outline-secondary" type="button" onclick="getValue()">Get Value</button>
                        </div>
                        <div id="valueResult" class="mt-2"></div>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header">Delete Key</div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" id="deleteKey" placeholder="Enter key to delete">
                            <button class="btn btn-outline-danger" type="button" onclick="deleteKey()">Delete</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>All Keys in Redis</span>
                        <button class="btn btn-sm btn-outline-secondary" onclick="getAllKeys()">Refresh</button>
                    </div>
                    <div class="card-body">
                        <div id="allKeys">
                            <p class="text-muted">Click refresh to load keys</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api/v1/chat/redis/keys';

        async function fetchWithErrorHandling(url, options = {}) {
            try {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    body: options.body ? JSON.stringify(options.body) : undefined
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Something went wrong');
                }
                return data;
            } catch (error) {
                alert(error.message);
                throw error;
            }
        }

        async function setKeyValue() {
            const key = document.getElementById('key').value;
            const value = document.getElementById('value').value;
            const ttl = document.getElementById('ttl').value || 300;

            if (!key || !value) {
                alert('Both key and value are required');
                return;
            }

            try {
                await fetchWithErrorHandling(API_BASE + '/', {
                    method: 'POST',
                    body: { key, value, ttl }
                });
                alert('Key set successfully!');
                document.getElementById('key').value = '';
                document.getElementById('value').value = '';
                getAllKeys();
            } catch (error) {
                console.error('Error setting key:', error);
            }
        }

        async function getValue() {
            const key = document.getElementById('getKey').value;
            if (!key) {
                alert('Please enter a key');
                return;
            }

            try {
                const data = await fetchWithErrorHandling(`${API_BASE}/?key=${encodeURIComponent(key)}`);
                document.getElementById('valueResult').innerHTML = 
                    `<div class="alert alert-success">
                        <strong>Value:</strong> ${data.value}
                    </div>`;
            } catch (error) {
                document.getElementById('valueResult').innerHTML = 
                    `<div class="alert alert-danger">${error.message}</div>`;
            }
        }

        async function deleteKey() {
            const key = document.getElementById('deleteKey').value;
            if (!key) {
                alert('Please enter a key to delete');
                return;
            }

            if (!confirm(`Are you sure you want to delete key: ${key}?`)) {
                return;
            }

            try {
                await fetchWithErrorHandling(`${API_BASE}/${encodeURIComponent(key)}`, {
                    method: 'DELETE'
                });
                alert('Key deleted successfully!');
                document.getElementById('deleteKey').value = '';
                getAllKeys();
            } catch (error) {
                console.error('Error deleting key:', error);
            }
        }

        async function getAllKeys() {
            try {
                const data = await fetchWithErrorHandling(API_BASE + '/');
                const keysContainer = document.getElementById('allKeys');
                
                if (Object.keys(data).length === 0) {
                    keysContainer.innerHTML = '<p class="text-muted">No keys found in Redis</p>';
                    return;
                }

                let html = '<div class="list-group">';
                for (const [key, value] of Object.entries(data)) {
                    html += `
                        <div class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong>${key}</strong>: ${value}
                                </div>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteKeyFromList('${key}')">
                                    Delete
                                </button>
                            </div>
                        </div>`;
                }
                html += '</div>';
                keysContainer.innerHTML = html;
            } catch (error) {
                console.error('Error fetching keys:', error);
                document.getElementById('allKeys').innerHTML = 
                    `<div class="alert alert-danger">Error fetching keys: ${error.message}</div>`;
            }
        }

        async function deleteKeyFromList(key) {
            if (!confirm(`Are you sure you want to delete key: ${key}?`)) {
                return;
            }

            try {
                await fetchWithErrorHandling(`${API_BASE}/${encodeURIComponent(key)}`, {
                    method: 'DELETE'
                });
                getAllKeys();
            } catch (error) {
                console.error('Error deleting key:', error);
            }
        }

        // Load all keys when the page loads
        document.addEventListener('DOMContentLoaded', getAllKeys);
    </script>
</body>
</html>
